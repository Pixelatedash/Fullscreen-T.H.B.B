
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Browser</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
       
        /* Tab Bar */
        #tabBar {
            display: flex;
            align-items: center;
            background: #333;
            padding: 5px;
        }
        .tab {
            background: #555;
            color: white;
            padding: 5px 10px;
            margin-right: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        .tab.active { background: #007bff; } /* Highlight active tab */
        .tab button {
            margin-left: 5px;
            background: red;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* Buttons */
        #controls { padding: 10px; display: flex; gap: 5px; }
        button { padding: 5px 10px; cursor: pointer; }

        /* Settings Menu */
        #settingsMenu {
            display: none;
            position: absolute;
            top: 40px; right: 10px;
            background: white;
            border: 1px solid #000;
            padding: 10px;
        }

        /* Content Area */
        #tabContent { height: 90vh; display: flex; flex-direction: column; }
        iframe { flex: 1; width: 100%; border: none; display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Tab Bar -->
    <div id="tabBar">
        <button onclick="newTab()">➕ New Tab</button>
        <button onclick="toggleSettings()">⚙️ Settings</button>
    </div>

    <!-- Settings Menu -->
    <div id="settingsMenu">
        <button onclick="toggleFullscreen()">Toggle Fullscreen</button>
    </div>

    <!-- Content Area -->
    <div id="tabContent"></div>

    <script>
        let tabs = [];
        let activeTab = null;

        function createStartPage(tabId) {
            let container = document.createElement("div");
            container.className = "startPage";
            container.innerHTML = `
                <div style="text-align:center; padding: 20px;">
                    <h1>Welcome to Mini Browser</h1>
                    <input type="text" id="searchBar${tabId}" placeholder="Search DuckDuckGo..." onkeypress="search(event, ${tabId})">
                    <button onclick="search(null, ${tabId})">Search</button>
                    <h3>Quick Links</h3>
                    <button onclick="openURL('https://www.google.com', ${tabId})">Google</button>
                    <button onclick="openURL('https://www.youtube.com', ${tabId})">YouTube</button>
                    <button onclick="openURL('https://www.github.com', ${tabId})">GitHub</button>
                </div>
            `;
            return container;
        }

        function newTab() {
            let tabId = tabs.length;

            // Create tab button
            let tab = document.createElement("div");
            tab.className = "tab";
            tab.innerHTML = `Tab ${tabId + 1} <button onclick="closeTab(${tabId}, event)">X</button>`;
            tab.onclick = () => switchTab(tabId);
            document.getElementById("tabBar").appendChild(tab);

            // Create tab content (Start Page)
            let startPage = createStartPage(tabId);
            document.getElementById("tabContent").appendChild(startPage);

            tabs.push({ tab, content: startPage });
            switchTab(tabId);
        }

        function switchTab(id) {
            tabs.forEach((t, index) => {
                t.content.style.display = index === id ? "block" : "none";
                t.tab.classList.toggle("active", index === id);
            });
            activeTab = id;
        }

        function closeTab(id, event) {
            event.stopPropagation(); // Prevent tab switch on close button click

            if (tabs[id]) {
                tabs[id].tab.remove();
                tabs[id].content.remove();
                tabs.splice(id, 1);

                // Rebuild tab IDs
                document.getElementById("tabBar").innerHTML = `<button onclick="newTab()">➕ New Tab</button> <button onclick="toggleSettings()">⚙️ Settings</button>`;
                tabs.forEach((t, index) => {
                    t.tab.innerHTML = `Tab ${index + 1} <button onclick="closeTab(${index}, event)">X</button>`;
                    t.tab.onclick = () => switchTab(index);
                    document.getElementById("tabBar").appendChild(t.tab);
                });

                // Switch to another tab or show Start Page if no tabs remain
                if (tabs.length > 0) {
                    switchTab(Math.max(0, id - 1));
                } else {
                    newTab();
                }
            }
        }

        function search(event, tabId) {
            if (event && event.key !== "Enter") return;
            let query = document.getElementById(`searchBar${tabId}`).value;
            if (query) openURL(`https://duckduckgo.com/?q=${encodeURIComponent(query)}&ia=web`, tabId);
        }

        function openURL(url, tabId) {
            let iframe = document.createElement("iframe");
            iframe.src = url;

            // Remove existing content and insert iframe
            document.getElementById("tabContent").replaceChild(iframe, tabs[tabId].content);
            tabs[tabId].content = iframe;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function toggleSettings() {
            let menu = document.getElementById("settingsMenu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }

        // Open the first tab on load
        newTab();
    </script>

</body>
</html>
